[project]
name = "querying-everything-everywhere-all-at-once"
version = "0.1.0"
description = "Companion code for the demo paper: Querying Everything Everywhere All at Once"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "bauplan>=0.0.3a509",
    "litellm>=1.81.14",
    "python-dotenv>=1.2.1",
    "datafusion>=51.0.0,<52",
    "pyiceberg>=0.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "python-dotenv>=1.2.1", "boto3>=1.37.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/app"]

[tool.ty.environment]
extra-paths = ["src", "src/app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
