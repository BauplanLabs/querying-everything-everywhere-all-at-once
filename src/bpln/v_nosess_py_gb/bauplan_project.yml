project:
  id: 34d77b6c-cf9a-4be5-afa1-c6defcec831f
  name: v_nosess_py_gb

parameters:
  cutoff_date:
    type: str
    default: "2019-10-24"
    description: End of observation window (exclusive). Features are computed from events before this date.
  label_end_date:
    type: str
    default: "2019-10-31"
    description: End of label window (inclusive). Users who purchase in [cutoff, label_end] are labeled as converters.
  size:
    type: int
    default: 0
    description: Max rows to keep in bronze layer. 0 means all rows.
